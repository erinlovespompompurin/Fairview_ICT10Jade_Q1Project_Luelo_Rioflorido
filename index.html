<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Q1 Project</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"> 

    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <style>

    body {
        display: flex;
        align-items: center;
        flex-direction: column;
        min-height: 100vh;
        margin: 0;
    }

    h1 {
        font-style: italic;
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
    }

    .menu {
        text-align: left;
    }
   
    form {
        background-color: #94a091;
        width: 500px;
        padding: 35px 45px;
        border-radius: 30px;
        box-shadow: 0 10px 30px rgba(80, 60, 40, 0.18);
    }

    label {
        font-size: 24px;
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        color: #ffe6d5;
    }

    input {
        accent-color: #8B6848;
    }

    button {
        background-color: #8B6848;
        color: white;
        border: none;
        border-radius: 20px;
        padding: 10px 25px;
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        font-size: 16px;
        cursor: pointer;
        box-shadow: 0 5px 12px rgba(80, 60, 40, 0.18);
    }

    button:hover {
        background-color: #6F5036;
    }

    p1 {
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        font-weight: bold;
        color: #392d21;
    }

    #output1 {
        background-color: #FFFDF8;
        width: 100%;
        box-sizing: border-box;
        margin-top: 20px;
        padding: 20px;
        border-radius: 20px;
    }

    </style>

</head>

<body>

    <br>
    <h1>Chewy Corner</h1>
    <br>

    <form>
        <br>
        <p1>SKU Generator</p1>
        <br>
        <br><br>

    <label>Choose your product category:</label>
    <br>
    <br>

    <select id="category">
        <option value="Chewy">Chewy</option>
        <option value="Bowl">Bowl</option>
        <option value="Topping">Topping</option>
        <option value="Sauce">Sauce</option>
    </select>

    <br>
    <br><br>

    <label>Choose your product:</label>
    <br>
    <br>

    <select id="product">
        <option value="Pistachio">Pistachio</option>
        <option value="Brownies">Brownies</option>
        <option value="Cookies">Cookies</option>
        <option value="Yogurt">Yogurt</option>
        <option value="Strawberries">Strawberries</option>
    </select>

    <br>
    <br><br>

    <label>Stock Quantity:</label>
    <br>
    <br>

    <input type="number" id="stock">
    <br>
    <br>
    <br>

    <button type="button" py-click="generate_sku">
        Generate SKU
    </button>
        <br> <br>

        <p1>——————— Generated SKU ———————</p1>
        <div id="output1"></div>

</form>
    <br>

    <a href="index.html">Go to Receipt Generator</a>
    <py-script src="main.py"></py-script>

 </body>
</html>
